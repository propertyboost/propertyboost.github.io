<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <title>Page not found | PropertyBoost</title>
  <link rel="icon" href="img/favicon_io/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="style/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: rgb(245 245 245 / 1);
    }

    .error-card {
      max-width: 28rem;
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: 2rem;
      border: 1px solid rgb(226 232 240 / 1);
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
    }

    .error-card img {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      object-fit: contain;
    }

    .error-card h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: rgb(13 45 90 / 1);
      margin-bottom: 0.75rem;
    }

    .error-card p {
      color: rgb(71 85 105 / 1);
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .error-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .error-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      padding: 0.85rem 1.25rem;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .error-links .primary {
      background: rgb(199 154 74 / 1);
      color: #fff;
    }

    .error-links .secondary {
      background: rgb(13 45 90 / 1);
      color: #fff;
    }
  </style>
</head>

<body class="gjs-t-body font-body">
  <main class="error-page">
    <div class="error-card">
      <img src="img/logo.png" alt="PropertyBoost" width="72" height="72" />
      <h1>404</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
      <div class="error-links">
        <a href="index.html" class="primary">Back to home (EN)</a>
        <a href="index-pt.html" class="secondary">Início (PT)</a>
        <a href="index-fr.html" class="secondary">Accueil (FR)</a>
      </div>
    </div>
  </main>
</body>

</html>
